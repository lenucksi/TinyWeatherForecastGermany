buildscript {
    
    repositories {
        google()
        mavenCentral()
  }

    dependencies {
        // AGP 8.12.x requires Gradle 8.13.x (see README, "Building" section).
        classpath 'com.android.tools.build:gradle:8.13.2'
    }


}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

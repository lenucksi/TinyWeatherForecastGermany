apply plugin: 'com.android.application'

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    namespace 'de.kaffeemitkoffein.tinyweatherforecastgermany'

    defaultConfig {
        applicationId "de.kaffeemitkoffein.tinyweatherforecastgermany"
        minSdkVersion 33
        targetSdkVersion 36
        versionCode 63
        versionName "0.63.4"
    }

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    // Keep source/target compatibility aligned with the Java 21 toolchain above.
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        // Robolectric builds its shadow runtime from the merged Android
        // resources, so unit tests must see them (raw files, layouts, manifest).
        unitTests.includeAndroidResources = true
        // Robolectric 4.16 on JDK 21 reflects into bootstrap classes. Without
        // these opens the tests fail with InaccessibleObjectException before
        // any assertion runs (documented in Robolectric's JDK 17+ setup).
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
                    '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '--add-opens=java.base/java.nio=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
                    '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED',
                    '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
                    '--add-opens=java.base/sun.nio.cs=ALL-UNNAMED',
                    '--add-opens=java.base/sun.security.action=ALL-UNNAMED',
                    '--add-opens=java.base/sun.util.calendar=ALL-UNNAMED'
        }
    }

    // TASK-16: the 439 pre-existing findings are frozen in this baseline.
    // abortOnError stays on, so every *new* finding still fails lintDebug in CI.
    lint {
        baseline = file('lint-baseline.xml')
        abortOnError = true
    }

    // TASK-12 (decision D-05): release signing material is injected at build
    // time from the environment (CI maps these to GitHub Environment secrets).
    // No keystore, alias or password is stored in this repository. Debug and
    // userdebug variants do not reference this config, so local debug builds
    // need none of these variables. See docs/signing.md.
    signingConfigs {
        release {
            def keystorePath = System.getenv('RELEASE_KEYSTORE_FILE')
            if (keystorePath) {
                storeFile file(keystorePath)
            }
            storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: ''
            keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

    userdebug {
        initWith release
        // initWith copies the release signing config; a userdebug fixture must
        // remain buildable without release secrets and must not be signed with
        // the release key (nor with the debug key, which is debug-only).
        signingConfig null
        minifyEnabled false
        shrinkResources false
        versionNameSuffix "-userdebug_"+new Date().format("yyyyMMDD")
    }
    debug {
        initWith release
        minifyEnabled false
        shrinkResources false
        signingConfig signingConfigs.debug
        versionNameSuffix "-debug_"+new Date().format("yyyyMMDD-HHmm00ss")
    }
    }
}

dependencies {
    // Gadgetbridge's WeatherSpec (AGPLv3) uses androidx.annotation.Nullable,
    // which has CLASS retention - javac only, no runtime dependency needed.
    compileOnly 'androidx.annotation:annotation:1.9.1'

    // TASK-16: JVM test foundation. The presence of testImplementation also
    // enables the (otherwise guarded) unit-test step in the CI workflow.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
}

// Robolectric normally downloads android-all-instrumented jars from Maven
// Central at *test runtime*, which is outside Gradle's dependency verification
// and was hitting HTTP 429 in CI. Resolve them as normal Gradle artifacts
// instead (so strict verification covers them) and point Robolectric at a
// local copy. Versions correspond to the SDKs pinned by the tests: 26, 28,
// 33 and 36.
// Maven Central repeatedly answered HTTP 429 for Robolectric artifacts in CI
// (including the ~250 MB android-all SDK jars downloaded by the test setup).
// Fetch the whole org.robolectric group from Google's read-through mirror of
// Maven Central; the content filter keeps every other dependency on the
// repositories declared in the root build. Strict sha256 verification in
// gradle/verification-metadata.xml still applies to every artifact.
repositories {
    exclusiveContent {
        forRepository {
            maven {
                url = uri('https://maven-central.storage-download.googleapis.com/maven2')
            }
        }
        filter {
            includeGroup('org.robolectric')
        }
    }
}

// One configuration per SDK: Gradle would otherwise resolve a single version
// of the android-all-instrumented module for the whole configuration.
configurations {
    robolectricApi26
    robolectricApi28
    robolectricApi33
    robolectricApi36
}

dependencies {
    robolectricApi26 'org.robolectric:android-all-instrumented:8.0.0_r4-robolectric-r1-i7'
    robolectricApi28 'org.robolectric:android-all-instrumented:9-robolectric-4913185-2-i7'
    robolectricApi33 'org.robolectric:android-all-instrumented:13-robolectric-9030017-i7'
    robolectricApi36 'org.robolectric:android-all-instrumented:16-robolectric-13921718-i7'
}

def robolectricSdkDir = layout.buildDirectory.dir('robolectric-android-all')

tasks.register('prepareRobolectricAndroidAll', Copy) {
    from configurations.robolectricApi26
    from configurations.robolectricApi28
    from configurations.robolectricApi33
    from configurations.robolectricApi36
    into robolectricSdkDir
}

tasks.withType(Test).configureEach {
    dependsOn tasks.named('prepareRobolectricAndroidAll')
    systemProperty 'robolectric.dependency.dir', robolectricSdkDir.get().asFile.absolutePath
    // With minSdk 33, Robolectric cannot load the app manifest under SDK 26/28
    // ("Requires newer sdk version #33"). Those variants are obsolete for this
    // fork; only run the API 33+ variants. Test sources are owned by TASK-16.
    systemProperty 'robolectric.enabledSdks', '33,36'
}

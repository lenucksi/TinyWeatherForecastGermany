apply plugin: 'com.android.application'

android {
    // compileSdkVersion 33
    compileSdkVersion 36
    // buildToolsVersion '33.0.1'
    buildToolsVersion '36.0.0'
    namespace 'de.kaffeemitkoffein.tinyweatherforecastgermany'

    defaultConfig {
        applicationId "de.kaffeemitkoffein.tinyweatherforecastgermany"
        minSdkVersion 19
        targetSdkVersion 36
        versionCode 63
        versionName "0.63.4"
    }

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    // Keep source/target compatibility aligned with the Java 21 toolchain above.
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    userdebug {
        initWith release
        minifyEnabled false
        shrinkResources false
        versionNameSuffix "-userdebug_"+new Date().format("yyyyMMDD")
    }
    debug {
        initWith release
        minifyEnabled false
        shrinkResources false
        signingConfig signingConfigs.debug
        versionNameSuffix "-debug_"+new Date().format("yyyyMMDD-HHmm00ss")
    }
    }
}

dependencies {
    // Gadgetbridge's WeatherSpec (AGPLv3) uses androidx.annotation.Nullable,
    // which has CLASS retention - javac only, no runtime dependency needed.
    compileOnly 'androidx.annotation:annotation:1.9.1'
}

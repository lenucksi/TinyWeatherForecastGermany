# Signed release build for TinyWeatherForecastGermany.
#
# The signing key is never stored in the repository. It is injected as a
# base64-encoded PKCS#12/JKS keystore from GitHub Environment secrets and
# materialized only in the runner's temporary directory (mode 0600), then
# removed at the end of the job. TASK-27 provisions the secrets in the
# `release` environment; TASK-28 will consume this workflow's artifact.
#
# Third-party actions are pinned to full commit SHAs, identical to build.yml
# (verified 2026-11-27). Keep the version comment next to each pin.

name: Signed release build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Least privilege: read-only repository access. No GITHUB_TOKEN elevation.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: assembleRelease / apksigner verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # TASK-27 creates this environment and stores the four secrets below.
    environment: release

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # GitHub-hosted runners ship the Android SDK but not necessarily
      # compileSdk 36 / build-tools 36.0.0 required by app/build.gradle.
      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/current/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            SDK_ARGS=()
            if [ -n "$SDK_ROOT" ]; then
              SDK_ARGS+=(--sdk_root="$SDK_ROOT")
            fi
            if ! "$SDKMANAGER" "${SDK_ARGS[@]}" "platforms;android-36" "build-tools;36.0.0"; then
              echo "::notice::sdkmanager could not install components; relying on AGP SDK auto-download"
            fi
          else
            echo "::notice::sdkmanager unavailable; relying on AGP SDK auto-download"
          fi

      # Fail early and with actionable messages instead of a cryptic AGP
      # "keystore not found" error. Do not echo any secret value.
      - name: Verify signing secrets are configured
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is empty or unset. Add it to the 'release' GitHub Environment (TASK-27)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to build an unsigned release: a signing secret is missing."
            exit 1
          fi
          echo "All four release signing secrets are present."

      - name: Materialize release keystore outside the repository
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/twfg-release-keystore.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "RELEASE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "Keystore decoded to RUNNER_TEMP (outside the checkout, mode 0600)."

      - name: Assemble signed release APK
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Dorg.gradle.dependency.verification=strict

      - name: Verify release APK signature with apksigner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found at $APKSIGNER"
            exit 1
          fi
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release"
            exit 1
          fi
          apk="${apks[0]}"
          echo "Verifying $apk"
          "$APKSIGNER" verify --verbose --print-certs "$apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # Always scrub the temporary key, including on build/verification failure.
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/twfg-release-keystore.jks"
